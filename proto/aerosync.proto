syntax = "proto3";

package aerosync.proto;

option java_package = "com.aerosync.app.proto";
option java_outer_classname = "AeroSyncProto";

// ============================================================================
// 1. DISCOVERY PROTOCOL
// ============================================================================

enum DeviceType {
    DEVICE_UNKNOWN = 0;
    DEVICE_ANDROID = 1;
    DEVICE_WINDOWS = 2;
    DEVICE_LINUX   = 3;
    DEVICE_MACOS   = 4;
    DEVICE_IOS     = 5;
}

message DiscoveryBeacon {
    string device_id = 1;
    string device_name = 2;
    DeviceType device_type = 3;
    string platform = 4;
    string app_version = 5;
    uint32 listening_port = 6;
    uint64 timestamp_ms = 7;
    repeated string capabilities = 8;
}

// ============================================================================
// 2. CONTROL PROTOCOL & FRAMING
// ============================================================================

enum MessageType {
    MSG_UNKNOWN         = 0;
    MSG_CONNECT_REQUEST = 1;
    MSG_CONNECT_ACCEPT  = 2;
    MSG_CONNECT_DECLINE = 3;
    MSG_PAIRING_REQUEST = 4;
    MSG_PAIRING_CONFIRM = 5;
    MSG_PAIRING_REJECT  = 6;
    MSG_TRANSFER_OFFER  = 7;
    MSG_TRANSFER_ACCEPT = 8;
    MSG_TRANSFER_CANCEL = 9;
    MSG_CHUNK_ACK       = 10;
    MSG_FILE_COMPLETE   = 11;
    MSG_ERROR           = 12;
    MSG_PING            = 13;
    MSG_PONG            = 14;
}

message ControlHeader {
    uint32 magic = 1;         // 0x4145524F ("AERO")
    MessageType msg_type = 2; // Control message type
    uint32 payload_len = 3;   // Length of payload following header
    uint32 sequence_num = 4;  // Frame sequence number for retransmission / ordering
    uint64 timestamp_ms = 5;  // Send timestamp in milliseconds
}

// ============================================================================
// 3. PAIRING & AUTHENTICATION PROTOCOL
// ============================================================================

enum PairingStatus {
    PAIRING_PENDING      = 0;
    PAIRING_ACCEPTED     = 1;
    PAIRING_DECLINED     = 2;
    PAIRING_TIMEOUT      = 3;
    PAIRING_BUSY         = 4;
    PAIRING_PIN_MISMATCH = 5;
}

message PairingRequest {
    string sender_id = 1;
    string sender_name = 2;
    DeviceType sender_type = 3;
    string platform = 4;
    string app_version = 5;
    string pairing_pin = 6;        // 6-digit numeric PIN (e.g. "849201")
    uint64 session_nonce = 7;      // Cryptographic nonce
    repeated string capabilities = 8;
}

message PairingResponse {
    PairingStatus status = 1;
    string session_token = 2;      // Authorized session token for transfer
    string responder_id = 3;
    string responder_name = 4;
    string reason = 5;             // Optional human-readable message / decline reason
    uint32 max_parallel_streams = 6; // Negotiated max streams (default 4)
    uint32 chunk_size_bytes = 7;   // Negotiated chunk size (default 4MB)
}

// ============================================================================
// 4. FILE TRANSFER NEGOTIATION & MANIFEST
// ============================================================================

message FileMetadata {
    uint32 file_index = 1;
    string relative_path = 2;
    uint64 file_size = 3;
    string sha256_hash = 4;
    uint32 permissions = 5;
    uint64 last_modified_ms = 6;
}

message TransferOffer {
    string batch_id = 1;
    string sender_id = 2;
    string sender_name = 3;
    string session_token = 4;
    uint32 total_files = 5;
    uint64 total_bytes = 6;
    repeated FileMetadata files = 7;
    uint32 proposed_chunk_size = 8;
    uint32 proposed_streams = 9;
}

message FileResumeOffset {
    uint32 file_index = 1;
    uint64 resume_offset = 2;
    repeated uint32 completed_chunks = 3;
}

message TransferAccept {
    string batch_id = 1;
    string session_token = 2;
    bool accepted = 3;
    string decline_reason = 4;
    repeated FileResumeOffset resume_offsets = 5;
    uint32 accepted_chunk_size = 6;
    uint32 accepted_streams = 7;
    uint16 data_port = 8;
}

// ============================================================================
// 5. HIGH-SPEED DATA CHUNK FRAMING
// ============================================================================

message ChunkHeader {
    string batch_id = 1;
    uint32 file_index = 2;
    uint32 chunk_index = 3;
    uint64 offset = 4;
    uint32 length = 5;
    uint32 crc32c = 6;            // Castagnoli CRC32C of chunk payload
    bool is_last_chunk = 7;
}

message ChunkAck {
    string batch_id = 1;
    uint32 file_index = 2;
    uint32 chunk_index = 3;
    bool valid = 4;
    uint32 crc32c = 5;
}

// ============================================================================
// 6. TELEMETRY, PROGRESS & ERROR REPORTING
// ============================================================================

enum TransferState {
    STATE_IDLE               = 0;
    STATE_WAITING_ACCEPTANCE = 1;
    STATE_CONNECTING         = 2;
    STATE_TRANSFERRING       = 3;
    STATE_COMPLETED          = 4;
    STATE_FAILED             = 5;
    STATE_DECLINED           = 6;
    STATE_CANCELLED          = 7;
}

message TransferProgress {
    string batch_id = 1;
    uint32 current_file_index = 2;
    string current_file_name = 3;
    uint64 file_bytes_transferred = 4;
    uint64 file_size = 5;
    uint64 batch_bytes_transferred = 6;
    uint64 batch_total_bytes = 7;
    double speed_bytes_per_sec = 8;
    double speed_mbps = 9;
    TransferState state = 10;
    uint32 active_streams = 11;
    double eta_seconds = 12;
}

message ErrorMessage {
    string batch_id = 1;
    int32 error_code = 2;
    string error_message = 3;
    string details = 4;
}
