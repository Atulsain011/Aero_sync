[package]
name = "aerosync-desktop"
version = "1.0.7"
description = "AeroSync Ultra High-Speed P2P Desktop Client"
authors = ["AeroSync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rfd = "0.16"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = false
