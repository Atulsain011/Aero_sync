name: Build and Release AeroSync

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Required when publishing from manual branch dispatch.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Mark release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'platform/windows/desktop_tauri/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: platform/windows/desktop_tauri
        run: npm ci

      - name: Build Web Assets
        working-directory: platform/windows/desktop_tauri
        run: npm run build

      - name: Build Windows Executable & NSIS Installer
        working-directory: platform/windows/desktop_tauri
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Prepare Windows Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $sourceExe = "platform/windows/desktop_tauri/src-tauri/target/release/aerosync-desktop.exe"
          if (-not (Test-Path $sourceExe)) {
            Write-Error "Executable not found at $sourceExe"
            exit 1
          }
          Copy-Item $sourceExe "artifacts/AeroSync.exe" -Force
          $setupExe = Get-ChildItem "platform/windows/desktop_tauri/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "artifacts/AeroSync-Setup-v1.0.4.exe" -Force
          } else {
            Write-Error "NSIS setup executable not found!"
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-Windows
          path: artifacts/*
          if-no-files-found: error

  build-android:
    name: Build Android Mobile App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android Release Binary
        run: |
          mkdir -p artifacts
          if [ -f "platform/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp platform/android/app/build/outputs/apk/release/app-release.apk artifacts/AeroSync.apk
          elif [ -f "platform/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp platform/android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/AeroSync.apk
          else
            echo "Error: Release APK not found!" >&2
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-Android
          path: artifacts/AeroSync.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AeroSync-Windows
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AeroSync-Android
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          name: AeroSync ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          body: |
            ## AeroSync Release

            High-speed peer-to-peer file transfer over local Wi-Fi and hotspot.

            ### Direct Downloads
            - **Windows Installer (Recommended)**: `AeroSync-Setup-v1.0.4.exe`
            - **Windows Portable Executable**: `AeroSync.exe`
            - **Android Mobile App**: `AeroSync.apk`

            ### Key Highlights
            - Zero-cloud, 100% peer-to-peer file transfer over local network
            - High-speed peer-to-peer file transfer over local Wi-Fi and hotspot
            - Peer discovery and secure PIN pairing
          files: |
            release-assets/AeroSync-Setup-v1.0.4.exe
            release-assets/AeroSync.exe
            release-assets/AeroSync.apk
