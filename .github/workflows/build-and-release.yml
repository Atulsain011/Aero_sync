name: Build and Release AeroSync

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Required when publishing from manual branch dispatch.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Mark release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'platform/windows/desktop_tauri/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: platform/windows/desktop_tauri
        run: npm ci

      - name: Build Web Assets
        working-directory: platform/windows/desktop_tauri
        run: npm run build

      - name: Build Windows Native Core Daemon (aerosync_daemon.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "platform/windows/desktop_tauri/aerosync_daemon.exe")) {
            mkdir -p build_win
            cmake -B build_win -S platform/windows -DCMAKE_BUILD_TYPE=Release
            cmake --build build_win --config Release
            if (Test-Path "build_win/Release/aerosync_daemon.exe") {
              Copy-Item "build_win/Release/aerosync_daemon.exe" "platform/windows/desktop_tauri/aerosync_daemon.exe" -Force
              Copy-Item "build_win/Release/aerosync_daemon.exe" "platform/windows/desktop_tauri/src-tauri/aerosync_daemon.exe" -Force
            } elseif (Test-Path "build_win/aerosync_daemon.exe") {
              Copy-Item "build_win/aerosync_daemon.exe" "platform/windows/desktop_tauri/aerosync_daemon.exe" -Force
              Copy-Item "build_win/aerosync_daemon.exe" "platform/windows/desktop_tauri/src-tauri/aerosync_daemon.exe" -Force
            }
          }

      - name: Build Windows Executable & NSIS Installer
        working-directory: platform/windows/desktop_tauri
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Prepare Windows Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $sourceExe = "platform/windows/desktop_tauri/src-tauri/target/release/aerosync-desktop.exe"
          if (-not (Test-Path $sourceExe)) {
            Write-Error "Executable not found at $sourceExe"
            exit 1
          }
          Copy-Item $sourceExe "artifacts/AeroSync.exe" -Force
          $setupExe = Get-ChildItem "platform/windows/desktop_tauri/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "artifacts/AeroSync-Setup-v1.0.7.exe" -Force
          } else {
            Write-Error "NSIS setup executable not found!"
            exit 1
          }

          # Create Portable Zip Bundle
          $portableDir = "artifacts/AeroSync-Windows-Portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item $sourceExe "$portableDir/AeroSync.exe" -Force
          $dllPath = "platform/windows/desktop_tauri/src-tauri/target/release/WebView2Loader.dll"
          if (Test-Path $dllPath) {
            Copy-Item $dllPath "$portableDir/WebView2Loader.dll" -Force
          }
          Compress-Archive -Path $portableDir -DestinationPath "artifacts/AeroSync-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-Windows
          path: artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop App (.AppImage / .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'platform/windows/desktop_tauri/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: platform/windows/desktop_tauri
        run: npm ci

      - name: Build Web Assets
        working-directory: platform/windows/desktop_tauri
        run: npm run build

      - name: Build Linux Native Core Daemon
        run: |
          mkdir -p build_linux
          cd build_linux
          cmake ../platform/windows -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cp aerosync_daemon ../platform/windows/desktop_tauri/src-tauri/aerosync_daemon

      - name: Build Linux AppImage & DEB Packages
        working-directory: platform/windows/desktop_tauri
        run: npx @tauri-apps/cli build --bundles appimage,deb

      - name: Prepare Linux Release Artifacts
        run: |
          mkdir -p linux-artifacts
          targetDir="platform/windows/desktop_tauri/src-tauri/target/release"
          
          if [ -f "$targetDir/aerosync-desktop" ]; then
            cp "$targetDir/aerosync-desktop" linux-artifacts/AeroSync-Linux
          fi
          
          appImage=$(find "$targetDir/bundle/appimage" -name "*.AppImage" 2>/dev/null | head -n 1)
          if [ -n "$appImage" ]; then
            cp "$appImage" linux-artifacts/AeroSync-v1.0.7-x86_64.AppImage
          fi
          
          debFile=$(find "$targetDir/bundle/deb" -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$debFile" ]; then
            cp "$debFile" linux-artifacts/aerosync_1.0.7_amd64.deb
          fi

          tar -czf linux-artifacts/AeroSync-Linux-Portable.tar.gz -C linux-artifacts AeroSync-Linux 2>/dev/null || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-Linux
          path: linux-artifacts/*
          if-no-files-found: error

  build-android:
    name: Build Android Mobile App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: platform/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android Release Binary
        run: |
          mkdir -p artifacts
          if [ -f "platform/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp platform/android/app/build/outputs/apk/release/app-release.apk artifacts/AeroSync.apk
          elif [ -f "platform/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp platform/android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/AeroSync.apk
          else
            echo "Error: Release APK not found!" >&2
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroSync-Android
          path: artifacts/AeroSync.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AeroSync-Windows
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: AeroSync-Linux
          path: release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AeroSync-Android
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          name: AeroSync ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          body: |
            ## AeroSync Release

            High-speed peer-to-peer file transfer over local Wi-Fi and hotspot.

            ### Windows
            - **Installer (Recommended)**: `AeroSync-Setup-v1.0.7.exe`
            - **Portable Package**: `AeroSync-Windows-Portable.zip`
            - **Standalone Executable**: `AeroSync.exe`

            ### Linux
            - **Universal AppImage**: `AeroSync-v1.0.7-x86_64.AppImage`
            - **Debian / Ubuntu Package**: `aerosync_1.0.7_amd64.deb`
            - **Linux Portable Archive**: `AeroSync-Linux-Portable.tar.gz`

            ### Android
            - **Mobile App**: `AeroSync.apk`

            ### Key Highlights
            - Zero-cloud, 100% peer-to-peer direct local network file transfer
            - Cross-platform support (Windows, Linux, Android)
            - Automated mDNS peer discovery & secure PIN pairing
          files: |
            release-assets/AeroSync-Setup-v1.0.7.exe
            release-assets/AeroSync-Windows-Portable.zip
            release-assets/AeroSync.exe
            release-assets/AeroSync-v1.0.7-x86_64.AppImage
            release-assets/aerosync_1.0.7_amd64.deb
            release-assets/AeroSync-Linux-Portable.tar.gz
            release-assets/AeroSync.apk
